name: licensing-scheduled-jobs

services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - PERSIST_STATE=1
      - S3_PERSIST=1
      - LOG_LEVEL=INFO
      - MINISTACK_REGION=eu-west-2
    volumes:
      - ./data/state:/tmp/ministack-state
      - ./data/s3:/tmp/ministack-data/s3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
